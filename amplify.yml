version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - yarn install --frozen-lockfile
    build:
      commands:
        - yarn build
  artifacts:
    # next.config.mjs の output: "export" により out/ に静的ファイルが生成される
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
